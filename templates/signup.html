{% extends "base.html" %}
{% block title %}Sign Up – LoanPredict AI{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:85vh;">
  <div class="col-md-4">
    <div class="glass p-4 p-lg-5">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus-fill" style="font-size:3rem;color:#22c55e;"></i>
        <h2 class="mt-2">Create Account</h2>
      </div>
      <form method="POST" action="{{ url_for('signup') }}">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" name="username" placeholder="Choose a username" required/>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" placeholder="Create a password" required/>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2">
          <i class="bi bi-person-check me-2"></i>Register
        </button>
      </form>
      <hr style="border-color:rgba(255,255,255,0.2); margin:1.5rem 0;"/>
      <p class="text-center text-white-70 mb-0">
        Already have an account?
        <a href="{{ url_for('login') }}" class="text-decoration-none" style="color:#a5b4fc;">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
