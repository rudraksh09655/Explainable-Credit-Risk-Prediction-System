{% extends "base.html" %}
{% block title %}Login – LoanPredict AI{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:85vh;">
  <div class="col-md-4">
    <div class="glass p-4 p-lg-5">
      <div class="text-center mb-4">
        <i class="bi bi-bank2" style="font-size:3rem;color:#6366f1;"></i>
        <h2 class="mt-2 mb-0">LoanPredict AI</h2>
        <p class="text-white-70 small">Smart • Fast • Reliable</p>
      </div>
      <h5 class="mb-3"><i class="bi bi-lock-fill me-2 text-indigo-300"></i>Sign In</h5>
      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" name="username" placeholder="Enter username" required/>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" placeholder="Enter password" required/>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>
      </form>
      <hr style="border-color:rgba(255,255,255,0.2); margin:1.5rem 0;"/>
      <p class="text-center text-white-70 mb-0">
        Don't have an account?
        <a href="{{ url_for('signup') }}" class="text-decoration-none" style="color:#a5b4fc;">Sign up</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
